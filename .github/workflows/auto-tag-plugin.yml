name: Auto-tag plugin version

# Automatically creates and pushes a git tag for EACH plugin whenever its
# version changes on master. Claude Code uses git tags to decide whether to
# offer plugin updates — a missed tag means users stay on the stale cached
# version (see CLAUDE.md SemVer rules).
#
# Tag scheme (multi-plugin):
#   - omh-git-workflow keeps the historical bare scheme:  v<version>   (e.g. v2.0.0)
#     (preserves all existing v1.x / v2.x tags — do NOT rename them)
#   - every other plugin is namespaced:  <plugin-name>-v<version>      (e.g. omh-sla-workflow-v1.0.0)
#
# For each plugin it verifies plugin.json version == its marketplace entry,
# then tags if that tag doesn't already exist. Refuses to move an existing tag.
#
# Trigger: any push to master that touches a manifest (typically a merged PR).

on:
  push:
    branches: [master]
    paths:
      - 'plugins/**/.claude-plugin/plugin.json'
      - '.claude-plugin/marketplace.json'

permissions:
  contents: write  # needed to push tags

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Tag each plugin whose version changed
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          MKT=.claude-plugin/marketplace.json
          PLUGIN_COUNT=$(jq -r '.plugins | length' "$MKT")
          CREATED=()
          SKIPPED=()

          for i in $(seq 0 $((PLUGIN_COUNT - 1))); do
            NAME=$(jq -r ".plugins[$i].name" "$MKT")
            SOURCE=$(jq -r ".plugins[$i].source" "$MKT")
            MKT_VER=$(jq -r ".plugins[$i].version" "$MKT")
            PLUGIN_JSON="${SOURCE#./}/.claude-plugin/plugin.json"

            if [ ! -f "$PLUGIN_JSON" ]; then
              echo "::error::$NAME: no plugin.json at $PLUGIN_JSON"
              exit 1
            fi
            PLUGIN_VER=$(jq -r '.version' "$PLUGIN_JSON")

            if [ "$PLUGIN_VER" != "$MKT_VER" ]; then
              echo "::error::$NAME version mismatch — plugin.json=$PLUGIN_VER, marketplace=$MKT_VER. Keep in sync per CLAUDE.md."
              exit 1
            fi

            # Tag prefix: omh-git-workflow stays on the historical bare 'v' scheme.
            if [ "$NAME" = "omh-git-workflow" ]; then
              TAG="v$PLUGIN_VER"
            else
              TAG="${NAME}-v$PLUGIN_VER"
            fi

            if git rev-parse "$TAG" >/dev/null 2>&1; then
              EXISTING_SHA=$(git rev-list -n 1 "$TAG")
              if [ "$EXISTING_SHA" = "$SHA" ]; then
                echo "$NAME: tag $TAG already at HEAD — nothing to do"
                SKIPPED+=("$TAG (already at HEAD)")
              else
                echo "::warning::$NAME: tag $TAG exists at $EXISTING_SHA but HEAD is $SHA. Refusing to move tag — bump version first."
                SKIPPED+=("$TAG (exists elsewhere — version not bumped)")
              fi
              continue
            fi

            git tag -a "$TAG" -m "Release $TAG: auto-tagged from $PLUGIN_JSON"
            git push origin "$TAG"
            echo "::notice::$NAME: pushed new tag $TAG at $SHA"
            CREATED+=("$TAG")
          done

          {
            echo "## Auto-tag result"
            echo ""
            echo "| Plugin tag | Action |"
            echo "|---|---|"
            for t in "${CREATED[@]:-}"; do [ -n "$t" ] && echo "| \`$t\` | created & pushed |"; done
            for t in "${SKIPPED[@]:-}"; do [ -n "$t" ] && echo "| \`$t\` | skipped |"; done
          } >> "$GITHUB_STEP_SUMMARY"
